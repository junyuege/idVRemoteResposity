name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run project validation
        working-directory: wx-id5-strategy
        run: node tools/validate-project.js

      - name: Run full smoke test
        working-directory: wx-id5-strategy
        run: node tools/smoke-test.js
